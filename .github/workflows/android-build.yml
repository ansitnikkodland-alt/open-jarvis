name: Android Build

on:
  push:
    branches: [main, feature/euronics-webview-integration, feature/jarvis-stable-1.0]
    paths:
      - "app/**"
      - "*.gradle"
      - "settings.gradle"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

  apk-build:
    name: apk-build
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  euronics-smoke-test:
    name: euronics-smoke-test
    needs: apk-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: open-jarvis-debug-apk
          path: app/build/outputs/apk/debug

      - name: Android emulator launch and Euronics V32 smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.openjarvis android.permission.RECORD_AUDIO
            adb shell settings put secure enabled_accessibility_services com.openjarvis/com.openjarvis.accessibility.JarvisAccessibilityService
            adb shell settings put secure accessibility_enabled 1
            adb shell am start -W -n com.openjarvis/.ui.MainActivity
            sleep 6
            adb shell dumpsys accessibility | grep -F 'JarvisAccessibilityService'
            adb shell pidof com.openjarvis >/dev/null || { adb logcat -d -t 1500; exit 1; }
            adb shell dumpsys activity activities | grep -F 'com.openjarvis/.ui.MainActivity'
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb shell cat /sdcard/window.xml > /tmp/jarvis-window.xml
            python3 - <<'PY'
            import re
            import subprocess
            import xml.etree.ElementTree as ET
            root = ET.parse("/tmp/jarvis-window.xml").getroot()
            target = next((node for node in root.iter("node")
                           if "EURONICS SERVICE REPORT" in (node.attrib.get("text") or "").upper()), None)
            if target is None:
                raise SystemExit("Euronics dashboard entry not found in UI hierarchy")
            match = re.fullmatch(r"\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]", target.attrib["bounds"])
            if not match:
                raise SystemExit("Could not parse Euronics button bounds")
            left, top, right, bottom = map(int, match.groups())
            subprocess.run(["adb", "shell", "input", "tap", str((left + right) // 2), str((top + bottom) // 2)], check=True)
            PY
            sleep 15
            adb logcat -d | grep -F 'EURONICS_HTML_TITLE:'
