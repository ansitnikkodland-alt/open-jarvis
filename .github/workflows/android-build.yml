name: Android Build

on:
  push:
    branches: [main, feature/euronics-webview-integration, feature/jarvis-stable-1.0, feature/jarvis-opendroid-agent-loop]
    paths:
      - "app/**"
      - "scripts/**"
      - "*.gradle"
      - "settings.gradle"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [feature/jarvis-stable-1.0, feature/jarvis-stable-1.0-phase2-wakeword, feature/jarvis-stable-1.0-phase3-ollama, feature/jarvis-stable-1.0-phase4-command-execution, feature/jarvis-jandal-memory-recall]
    paths:
      - "app/**"
      - "scripts/**"
      - "*.gradle"
      - "settings.gradle"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official sherpa-onnx Android AAR
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 --output app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  app/libs/sherpa-onnx.aar" | sha256sum --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

  apk-build:
    name: apk-build
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Restore stable preview debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: open-jarvis-preview-debug-signing-v1

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-preview-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  smoke-test:
    name: smoke-test-minimal
    needs: apk-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: jarvis-preview-debug-apk
          path: app/build/outputs/apk/debug

      - name: Install, resume MainActivity, and check for crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/smoke-minimal.sh

      - name: Upload minimal smoke logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-smoke-logcat
          path: artifacts/minimal-smoke-logcat.txt
          if-no-files-found: error


  release-ready-apk:
    name: release-ready-preview-apk
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Download smoke-tested candidate APK
        uses: actions/download-artifact@v4
        with:
          name: jarvis-preview-debug-apk
          path: app/build/outputs/apk/debug

      - name: Verify APK artifact exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publish verified Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-Jarvis-Preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  euronics-ui-optional:
    name: euronics-ui-optional (non-blocking)
    needs: apk-build
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: jarvis-preview-debug-apk
          path: app/build/outputs/apk/debug

      - name: Android emulator Euronics V32 UI tap validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/euronics-smoke.sh

      - name: Upload Euronics UI hierarchy on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: euronics-ui-hierarchy
          path: artifacts/euronics-ui.xml
          if-no-files-found: error
