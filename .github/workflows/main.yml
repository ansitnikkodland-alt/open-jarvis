name: Open Jarvis Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/jarvis-stable-1.0
      - feature/jarvis-stable-1.0-phase2-wakeword
      - feature/jarvis-jandal-memory-recall

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official sherpa-onnx Android AAR
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar \
            --output app/libs/sherpa-onnx.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  app/libs/sherpa-onnx.aar" | sha256sum --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: bash scripts/smoke-minimal.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-Jarvis-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
